# SonarQube Configuration for BNX Convertidor
sonar.projectKey=bnx-convertidor
sonar.projectName=BNX Convertidor
sonar.projectVersion=1.0

# Source directories
sonar.sources=src,lambda,api,ui/src
sonar.tests=tests

# Python
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

# JavaScript/React
sonar.javascript.lcov.reportPaths=ui/coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/__pycache__/**,**/dist/**,**/*.min.js,src/migrator/**,src/ir/**,src/vm/**,src/operators/**,src/core/**,src/physical/**,src/transforms/**,src/ml/**,src/bnxconvertidor.egg-info/**

# Encoding
sonar.sourceEncoding=UTF-8
